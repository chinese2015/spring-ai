spring:
  application:
    name: mcp-plus-integration-example
  
  ai:
    mcp:
      plus:
        enabled: true
        context:
          enabled: true
          session:
            max-inactive-interval: PT30M
          thread-safety:
            strategy: adaptive

logging:
  level:
    com.example: DEBUG
    org.springframework.ai.mcp.plus: DEBUG
